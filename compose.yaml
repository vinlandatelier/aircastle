services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_USER: aircastle
      POSTGRES_PASSWORD: aircastle-local
      POSTGRES_DB: aircastle
    ports:
      - "127.0.0.1:${AIRCASTLE_DB_PORT:-43123}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "aircastle", "-d", "aircastle"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 5s
    stop_grace_period: 30s

volumes:
  postgres-data:
