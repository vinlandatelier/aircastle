name: Aircastle setup
description: Install the pinned toolchain and frozen dependencies.
runs:
  using: composite
  steps:
    - name: Set up Vite+, Node and Bun
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        run-install: |
          args: ['--frozen-lockfile']
        cache: true
    - name: Verify pinned toolchain
      shell: bash
      run: |
        vp --version
        test "$(node --version)" = "v$(cat .node-version)"
        test "$(bun --version)" = "$(cat .bun-version)"
