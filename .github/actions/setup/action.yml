name: Aircastle setup
description: Install pinned runtimes and frozen dependencies; optionally install Chromium.
inputs:
  chromium:
    description: Install Chromium and its system libraries
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Vite+, Node and Bun
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
      with:
        version: 1.4.0
        node-version: 24.11.0
        run-install: |
          args: ['--frozen-lockfile']
        cache: true
    - name: Record and verify toolchain
      shell: bash
      run: |
        mkdir -p reports/ci
        {
          node --version
          bun --version
          vp --version
        } | tee reports/ci/toolchain.log
        test "$(node --version)" = v24.11.0
        test "$(bun --version)" = 1.3.4
    - name: Install Chromium
      shell: bash
      run: |
        vp -C apps/web exec playwright install --with-deps chromium
      if: ${{ inputs.chromium == 'true' }}
