name: Gardener
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      max_prs:
        description: Most pull requests to open
        type: choice
        options: ["3", "2", "1", "0"]
        default: "3"
permissions: {}
concurrency:
  group: gardener
  cancel-in-progress: false
env:
  GARDENER_MAX_PRS: ${{ inputs.max_prs || '3' }}
defaults:
  run:
    shell: bash
jobs:
  audit:
    if: >-
      github.ref == 'refs/heads/main' && github.repository_owner == 'vinlandatelier' &&
      vars.AI_TRIGGER_LOGIN != '' && vars.AI_TRIGGER_USER_ID != '' &&
      (github.event_name == 'schedule' || (github.triggering_actor == vars.AI_TRIGGER_LOGIN &&
      github.event.sender.id == vars.AI_TRIGGER_USER_ID))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ai-automation
    permissions:
      contents: read
      pull-requests: read
    outputs:
      count: ${{ steps.bundle.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm install --global @anthropic-ai/claude-code@2.1.308
      - name: List pull requests the gardener must not duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gardener/out"
          {
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title,state,headRefName,body
            gh pr list --repo "$GITHUB_REPOSITORY" --state all --label gardener --limit 500 --json number,title,state,headRefName,body
          } | jq -s 'add | unique_by(.number)' > "$RUNNER_TEMP/gardener/known-prs.json"
      - name: Run the gardener
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export GARDENER_OUT="$RUNNER_TEMP/gardener/out"
          export GARDENER_PRS="$RUNNER_TEMP/gardener/known-prs.json"
          GARDENER_DEADLINE=$(($(date +%s) + 150 * 60))
          export GARDENER_DEADLINE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          timeout 155m claude -p "Follow .agents/skills/gardener/SKILL.md." \
            --model "$(jq -r .roles.implementer.model .github/ai-models.json)" \
            --effort "$(jq -r .roles.implementer.effort .github/ai-models.json)" \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose > "$RUNNER_TEMP/gardener/transcript.jsonl"
      - id: bundle
        name: Bundle approved branches
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/gardener/out"
          if [ -f "$out/report.md" ]; then cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          count=$(jq 'if type == "array" then length else 0 end' "$out/prs.json" 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ] && [ -n "$(git for-each-ref --count=1 refs/heads/gardener/)" ]; then
            git bundle create "$out/branches.bundle" --branches='gardener/*' "^$GITHUB_SHA"
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gardener
          path: ${{ runner.temp }}/gardener
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: audit
    if: ${{ !cancelled() && needs.audit.outputs.count != '' && needs.audit.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ai-automation
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          owner: vinlandatelier
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gardener
          path: ${{ runner.temp }}/gardener
      - name: Open labeled pull requests
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gardener"
          gh label create gardener --repo "$GITHUB_REPOSITORY" --force \
            --color 2E7D32 --description "Opened by the scheduled gardener"
          git fetch --no-tags "$dir/out/branches.bundle" '+refs/heads/gardener/*:refs/remotes/gardener/*'
          while IFS= read -r entry; do
            branch=$(jq -r .branch <<<"$entry")
            title=$(jq -r .title <<<"$entry")
            if [[ ! "$branch" =~ ^gardener/[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ -z "$title" || "$title" == *$'\n'* ]]; then
              echo "::error::Rejected a malformed manifest entry."
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/$branch"
            if [ -n "$(git diff --name-only "$GITHUB_SHA" "refs/remotes/$branch" -- .github/workflows)" ]; then
              echo "::error::$branch changes workflow files. Skipped."
              continue
            fi
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "::notice::$branch already exists. Skipped."
              continue
            fi
            jq -r .body <<<"$entry" > "$dir/body.md"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "refs/remotes/$branch:refs/heads/$branch"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body-file "$dir/body.md" \
              --label gardener --label ready-for-human-approval
          done < <(jq -c --argjson max "$GARDENER_MAX_PRS" '.[:$max][]' "$dir/out/prs.json")
