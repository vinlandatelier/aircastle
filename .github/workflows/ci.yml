name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    outputs:
      coverage_summary: ${{ steps.coverage-summary.outcome }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run build
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run lint
      - name: Test packages, contracts, CLI, SDK and Postgres
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:prepared
      - name: Test database runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:db
      - id: coverage
        name: Test schema coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:coverage
      - id: coverage-summary
        name: Summarize schema coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        env:
          RESULT: ${{ steps.coverage.outcome == 'success' && 'passed' || 'is below thresholds' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '<!-- aircastle-coverage -->'
            echo "### Schema coverage ${RESULT} on ${SHA:0:7}"
            echo
            echo '| Statements | Branches | Functions | Lines |'
            echo '|---|---|---|---|'
            jq -r '.total | [.statements, .branches, .functions, .lines] | map("\(.pct)% (\(.covered)/\(.total))") | "| " + join(" | ") + " |"' \
              packages/schema/coverage/coverage-summary.json
            echo
            echo "Thresholds are set in \`packages/schema/vite.config.ts\`. [Run details](${RUN_URL})"
          } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage summary
        if: ${{ !cancelled() && steps.coverage-summary.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage.md
          retention-days: 1
  coverage-comment:
    name: Comment schema coverage
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.coverage_summary == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-summary
          path: ${{ runner.temp }}
      - name: Create or update the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- aircastle-coverage -->"))) | .id')
          if [ -n "$ids" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/${ids%%$'\n'*}" -F body=@"$RUNNER_TEMP/coverage.md" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/coverage.md" > /dev/null
          fi
