name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run build
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run lint
      - name: Test packages, contracts, CLI, SDK and Postgres
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:prepared
      - name: Test database runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:db
