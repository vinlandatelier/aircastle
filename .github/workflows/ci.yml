name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run build
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run lint
      - name: Find unused code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run knip
      - name: Test packages, contracts, CLI, SDK and Postgres
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:prepared
      - name: Test database runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:db
      - id: chromium
        name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp -C apps/web exec playwright install --with-deps chromium
      - id: browser
        name: Test browser journeys
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: vp run test-web:e2e
      - name: Upload browser reports
        if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports
          path: apps/web/reports/
          if-no-files-found: warn
          retention-days: 7
      - id: coverage
        name: Test schema coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:coverage
      - name: Summarize schema coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        env:
          RESULT: ${{ steps.coverage.outcome == 'success' && 'passed' || 'is below thresholds' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Schema coverage ${RESULT} on ${SHA:0:7}"
            echo
            echo '| Statements | Branches | Functions | Lines |'
            echo '|---|---|---|---|'
            jq -r '.total | [.statements, .branches, .functions, .lines] | map("\(.pct)% (\(.covered)/\(.total))") | "| " + join(" | ") + " |"' \
              packages/schema/coverage/coverage-summary.json
            echo
            echo "Thresholds are set in \`packages/schema/vite.config.ts\`. [Run details](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
