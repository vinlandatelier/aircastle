name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  static:
    name: Build, typecheck, lint, type fixtures and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup
      - name: Lint workflows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run lint:workflows
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run build
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run lint
      - name: Find unused code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run knip
      - name: Test type fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vp run test:fixtures
      - id: coverage
        name: Test schema coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: vp run test:coverage
      - name: Summarize schema coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        env:
          RESULT: ${{ steps.coverage.outcome == 'success' && 'passed' || 'is below thresholds' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Schema coverage ${RESULT} on ${SHA:0:7}"
            echo
            echo '| Statements | Branches | Functions | Lines |'
            echo '|---|---|---|---|'
            jq -r '.total | [.statements, .branches, .functions, .lines] | map("\(.pct)% (\(.covered)/\(.total))") | "| " + join(" | ") + " |"' \
              packages/schema/coverage/coverage-summary.json
            echo
            echo "Thresholds are set in \`packages/schema/vite.config.ts\`. [Run details](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  units:
    name: Test packages, CLI, SDK and Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-save: "false"
      - run: vp run build
      - run: vp run db:test -- vp run test:units

  database:
    name: Test database runner
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-save: "false"
      - run: vp run test:db

  browser:
    name: Test browser journeys (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-save: "false"
      - id: playwright
        name: Read Playwright version
        run: echo "version=$(vp -C apps/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - id: chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install Chromium
        run: vp -C apps/web exec playwright install --only-shell chromium
      - name: Save Chromium before building or testing the pull request
        if: ${{ steps.chromium-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}
      - run: vp run build
      - id: browser
        name: Test browser journeys
        run: vp run test-web:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.shard }}
          path: apps/web/reports/results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser reports
        if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports-${{ matrix.shard }}
          path: apps/web/reports/
          if-no-files-found: warn
          retention-days: 7

  browser-timings:
    name: Summarize browser timings
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-results-*
          path: browser-results
      - name: Post the 10 slowest journeys
        run: |
          {
            echo '### Slowest browser journeys'
            echo
            echo '| Duration | Journey |'
            echo '|---|---|'
            jq -rs '[.[] | .. | objects | select(has("specs")) | .specs[]
                | {name: "\(.file):\(.line) › \(.title | gsub("\\|"; "\\|"))", ms: ([.tests[].results[].duration] | add // 0)}]
              | sort_by(-.ms) | .[:10][] | "| \(.ms / 100 | round / 10)s | \(.name) |"' browser-results/*/results.json
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Lint, typecheck and test
    needs: [static, units, database, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success")' <<< "$RESULTS"
