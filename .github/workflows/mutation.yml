name: Mutation
on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package: [schema, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: vp run build
      - name: Run and classify mutations
        run: vp -C packages/${{ matrix.package }} run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.package }}-${{ github.run_attempt }}
          path: packages/${{ matrix.package }}/reports/mutation/
          retention-days: 14
