name: Advisory AI review and explicit fixes
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: >-
    ${{ contains(github.event.comment.body, '@vinland-ai') && github.event.comment.user.id == vars.AI_TRIGGER_USER_ID
    && format('ai-automation-pr-{0}', github.event.issue.number) || format('ai-automation-run-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' && github.repository_owner == 'vinlandatelier' &&
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@vinland-ai') && vars.AI_TRIGGER_LOGIN != '' &&
      vars.AI_TRIGGER_USER_ID != '' && github.event.comment.user.login == vars.AI_TRIGGER_LOGIN &&
      github.event.comment.user.id == vars.AI_TRIGGER_USER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ai-automation
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      verify_matrix: ${{ steps.plan.outputs.verify_matrix }}
      has_verification: ${{ steps.plan.outputs.has_verification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          owner: vinlandatelier
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-environments: read
          permission-administration: read
      - id: plan
        run: node scripts/ai-automation/cli.ts prepare
        env:
          AI_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          AI_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_BOT_USER_ID: ${{ vars.AI_BOT_USER_ID }}
          AI_TRIGGER_LOGIN: ${{ vars.AI_TRIGGER_LOGIN }}
          AI_TRIGGER_USER_ID: ${{ vars.AI_TRIGGER_USER_ID }}
          AI_CONTROL_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-plan
          path: ai-data/plan
          if-no-files-found: ignore
          retention-days: 14
  model:
    needs: prepare
    if: needs.prepare.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ai-automation
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-plan
          path: ai-data/plan
      - run: npm install --global @anthropic-ai/claude-code@2.1.308
      - run: node scripts/ai-automation/cli.ts model
        env:
          AI_OPERATION_ID: ${{ matrix.id }}
          AI_CONTROL_SHA: ${{ github.sha }}
          AI_MODEL_RECEIPTS_DIR: ai-data/model/receipts
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ai-model-${{ matrix.id }}
          path: ai-data/model
          if-no-files-found: ignore
          retention-days: 14
  verify:
    needs: [prepare, model]
    if: always() && needs.prepare.outputs.has_verification == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.verify_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-plan
          path: ai-data/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-model-${{ matrix.id }}
          path: ai-data/model
      - run: node scripts/ai-automation/cli.ts verify
        env:
          AI_OPERATION_ID: ${{ matrix.id }}
          AI_CONTROL_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ai-verification-${{ matrix.id }}
          path: ai-data/verification
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: [prepare, model, verify]
    if: always() && github.ref == 'refs/heads/main' && needs.prepare.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ai-automation
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.AI_APP_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          owner: vinlandatelier
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-plan
          path: ai-data/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: ai-model-${{ matrix.id }}
          path: ai-data/model
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.task != 'review'
        continue-on-error: true
        with:
          name: ai-verification-${{ matrix.id }}
          path: ai-data/verification
      - run: node scripts/ai-automation/cli.ts publish
        env:
          AI_OPERATION_ID: ${{ matrix.id }}
          AI_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          AI_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_BOT_USER_ID: ${{ vars.AI_BOT_USER_ID }}
          AI_TRIGGER_LOGIN: ${{ vars.AI_TRIGGER_LOGIN }}
          AI_TRIGGER_USER_ID: ${{ vars.AI_TRIGGER_USER_ID }}
          AI_CONTROL_SHA: ${{ github.sha }}
