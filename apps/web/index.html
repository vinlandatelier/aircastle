<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <script>
      ;(() => {
        let theme = 'dark'
        try {
          if (localStorage.getItem('aircastle-theme') === 'light') theme = 'light'
        } catch {}
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aircastle: The Headless CMS with Next-Generation Agentic Capabilities</title>
    <meta
      name="description"
      content="Aircastle is a code-first, headless CMS with agentic capabilities designed to automate the slow, manual parts of managing written content."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
